name: Generate README assets

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: fetch stats cards and recolor them to lilac
        run: |
          mkdir -p dist
          user=${{ github.repository_owner }}
          cards=https://github-profile-summary-cards.vercel.app/api/cards
          curl -fsSL "$cards/stats?username=$user&theme=github_dark" -o dist/stats.svg
          curl -fsSL "$cards/most-commit-language?username=$user&theme=github_dark" -o dist/top-langs.svg
          curl -fsSL "https://github-trophies.vercel.app/?username=$user&theme=darkhub&no-frame=true&no-bg=true&margin-w=6&column=6" -o dist/trophies.svg
          sed -i 's/#0366d6/#B794F6/gI' dist/stats.svg dist/top-langs.svg
          sed -i 's/#ff79c6/#B794F6/gI; s/#8be9fd/#D6BCFA/gI; s/#388bfd/#B794F6/gI; s/#6272a4/#9F7AEA/gI' dist/trophies.svg

      - name: push assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
