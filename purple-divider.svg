<svg width="400" height="20" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purple-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a259ff">
        <animate attributeName="offset" values="0;1" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#6a11cb">
        <animate attributeName="offset" values="0.5;1.5" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a259ff">
        <animate attributeName="offset" values="1;2" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="400" height="10" fill="url(#purple-gradient)" />
</svg>
